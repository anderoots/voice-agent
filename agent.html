<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://elevenlabs.io/convai-widget/index.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Force the widget to stay centered, not floating to corner */
    elevenlabs-convai {
      position: static !important;
    }
  </style>
</head>
<body>
  <elevenlabs-convai id="widget"></elevenlabs-convai>
  <script>
    const params = new URLSearchParams(location.search);
    const agentId = params.get('agent_id');
    if (agentId) {
      document.getElementById('widget').setAttribute('agent-id', agentId);
    }

    const widget = document.getElementById('widget');

    // Notify parent when call starts/ends
    ['elevenlabs-convai:call-started', 'call-started'].forEach(ev => {
      widget.addEventListener(ev, () => window.parent.postMessage({ type: 'call-started' }, '*'));
    });
    ['elevenlabs-convai:call-ended', 'call-ended'].forEach(ev => {
      widget.addEventListener(ev, () => window.parent.postMessage({ type: 'call-ended' }, '*'));
    });

    // Listen for commands from parent
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'start-call') {
        // Try widget.startSession(), then fall back to clicking the call button
        if (typeof widget.startSession === 'function') {
          widget.startSession();
        } else {
          const tryClick = (root) => {
            if (!root) return false;
            // ElevenLabs call button typically has aria-label with "call" or "start"
            const btn = root.querySelector('[aria-label*="call" i], [aria-label*="start" i], [aria-label*="llamar" i], button[class*="call"], button[class*="start"]');
            if (btn) { btn.click(); return true; }
            for (const el of root.querySelectorAll('*')) {
              if (el.shadowRoot && tryClick(el.shadowRoot)) return true;
            }
            return false;
          };
          // Small delay to ensure widget is fully rendered
          setTimeout(() => tryClick(widget.shadowRoot || document), 300);
        }
      }
      if (e.data?.type === 'hang-up') {
        // Try the widget's public endSession method, then fall back to clicking the end-call button
        if (typeof widget.endSession === 'function') {
          widget.endSession();
        } else {
          // Walk shadow DOM to find and click the hang-up/end button
          const tryClick = (root) => {
            if (!root) return false;
            const btn = root.querySelector('[aria-label*="end" i], [aria-label*="hang" i], [aria-label*="colgar" i], button.end-call, button[class*="end"]');
            if (btn) { btn.click(); return true; }
            for (const el of root.querySelectorAll('*')) {
              if (el.shadowRoot && tryClick(el.shadowRoot)) return true;
            }
            return false;
          };
          tryClick(widget.shadowRoot || document);
        }
      }
    });
  </script>
</body>
</html>
