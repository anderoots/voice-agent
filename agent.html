<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://elevenlabs.io/convai-widget/index.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    /* Hide the widget visually — it runs in background as audio engine */
    elevenlabs-convai {
      position: fixed !important;
      bottom: -9999px !important;
      right: -9999px !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <elevenlabs-convai id="widget"></elevenlabs-convai>
  <script>
    const params = new URLSearchParams(location.search);
    const agentId = params.get('agent_id');
    if (agentId) document.getElementById('widget').setAttribute('agent-id', agentId);

    const widget = document.getElementById('widget');

    // Bubble call state up to parent
    ['elevenlabs-convai:call-started', 'call-started'].forEach(ev =>
      widget.addEventListener(ev, () => window.parent.postMessage({ type: 'call-started' }, '*'))
    );
    ['elevenlabs-convai:call-ended', 'call-ended'].forEach(ev =>
      widget.addEventListener(ev, () => window.parent.postMessage({ type: 'call-ended' }, '*'))
    );

    // Click the first button found inside shadow DOM (works for both start and end)
    function clickInShadow(root, selectors) {
      for (const sel of selectors) {
        const el = root.querySelector(sel);
        if (el) { el.click(); return true; }
      }
      for (const el of root.querySelectorAll('*')) {
        if (el.shadowRoot && clickInShadow(el.shadowRoot, selectors)) return true;
      }
      return false;
    }

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'start-call') {
        if (typeof widget.startSession === 'function') {
          widget.startSession();
        } else {
          // Retry a few times until the widget button is in the DOM
          let attempts = 0;
          const try_ = () => {
            const found = clickInShadow(widget.shadowRoot || document, [
              '[aria-label*="call" i]', '[aria-label*="start" i]',
              'button', '[role="button"]',
            ]);
            if (!found && ++attempts < 8) setTimeout(try_, 300);
          };
          setTimeout(try_, 200);
        }
      }

      if (e.data?.type === 'hang-up') {
        if (typeof widget.endSession === 'function') {
          widget.endSession();
        } else {
          clickInShadow(widget.shadowRoot || document, [
            '[aria-label*="end" i]', '[aria-label*="hang" i]',
            '[aria-label*="stop" i]', 'button',
          ]);
        }
      }
    });
  </script>
</body>
</html>
