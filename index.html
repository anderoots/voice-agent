<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agents — Demo</title>
  <script src="https://elevenlabs.io/convai-widget/index.js" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080810;
      --surface: #0f0f1a;
      --border: #1e1e30;
      --border-active: #7c5cfc;
      --accent: #7c5cfc;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #52526e;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 3.5rem 1rem 2.5rem;
    }
    header h1 {
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -.03em;
      color: rgba(255,255,255,.08);
      line-height: 1;
      margin-bottom: .6rem;
      background: linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--muted);
      font-size: .95rem;
      letter-spacing: .01em;
    }

    /* ── Status banner ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      max-width: 720px;
      margin: 0 auto 1.5rem;
      background: rgba(124,92,252,.1);
      border: 1px solid rgba(124,92,252,.25);
      border-radius: 10px;
      padding: .6rem 1.2rem;
      font-size: .88rem;
      color: var(--accent2);
    }
    #status-bar.visible { display: flex; }
    .dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    #status-bar span { flex: 1; }
    #end-btn {
      background: none;
      border: 1px solid rgba(239,68,68,.5);
      color: var(--danger);
      border-radius: 6px;
      padding: .2rem .7rem;
      cursor: pointer;
      font-size: .8rem;
      transition: background .2s;
    }
    #end-btn:hover { background: rgba(239,68,68,.12); }

    /* ── Grid ── */
    main {
      flex: 1;
      padding: 0 1.5rem 4rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      max-width: 1050px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* ── Agent column ── */
    .agent-col {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    .agent-label {
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      padding-left: .25rem;
      transition: color .3s;
    }
    .agent-col.active .agent-label { color: var(--accent2); }

    /* ── Widget card ── */
    .widget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      transition: border-color .35s, box-shadow .35s;
      aspect-ratio: 9 / 14;
      display: flex;
      flex-direction: column;
    }
    .agent-col.active .widget-card {
      border-color: var(--border-active);
      box-shadow: 0 0 0 1px var(--border-active), 0 12px 40px rgba(124,92,252,.2);
    }

    /* Widget fills the card */
    .widget-card elevenlabs-convai {
      display: block;
      width: 100%;
      flex: 1;
    }

    /* ── Lock overlay ── */
    .lock-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(8,8,16,.72);
      backdrop-filter: blur(4px);
      z-index: 10;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .75rem;
      border-radius: 16px;
    }
    .lock-overlay.visible { display: flex; }
    .lock-icon {
      font-size: 2rem;
      opacity: .5;
    }
    .lock-overlay p {
      font-size: .8rem;
      color: var(--muted);
      text-align: center;
      padding: 0 1rem;
      line-height: 1.5;
    }

    /* ── Active indicator dot on label ── */
    .agent-label .live-dot {
      display: none;
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
      vertical-align: middle;
      margin-left: 6px;
    }
    .agent-col.active .agent-label .live-dot { display: inline-block; }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: rgba(255,255,255,.1);
      font-size: .75rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <h1>Voice Agents</h1>
  <p>Selecciona un agente para iniciar una conversación de voz</p>
</header>

<main>
  <!-- Status bar -->
  <div id="status-bar">
    <span class="dot"></span>
    <span>Sesión activa con <strong id="active-name"></strong></span>
    <button id="end-btn" onclick="endSession()">Terminar sesión</button>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>Voice Agents Demo &mdash; Powered by ElevenLabs</footer>

<script>
  const agents = [
    {
      id: 'cindy',
      name: 'Cindy',
      agentId: 'agent_8001kqcwjt80ek9be1q8865tpmg5',
    },
    {
      id: 'vanessa',
      name: 'Vanessa',
      agentId: 'agent_5601kqd9rrmgfe2bp53yb07x04kd',
    },
    {
      id: 'tripti',
      name: 'Tripti',
      agentId: 'agent_2101kqd9yxgef1xv216215nbc466',
    },
  ];

  let activeId = null;

  function buildGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = agents.map(a => `
      <div class="agent-col" id="col-${a.id}">
        <div class="agent-label">
          ${a.name}<span class="live-dot"></span>
        </div>
        <div class="widget-card">
          <elevenlabs-convai
            id="widget-${a.id}"
            agent-id="${a.agentId}"
          ></elevenlabs-convai>
          <div class="lock-overlay" id="lock-${a.id}">
            <div class="lock-icon">🔒</div>
            <p>Sesión activa con <strong id="lock-name-${a.id}"></strong></p>
          </div>
        </div>
      </div>
    `).join('');

    // Attach event listeners after DOM is built
    agents.forEach(a => attachWidgetEvents(a));
  }

  function attachWidgetEvents(agent) {
    const widget = document.getElementById('widget-' + agent.id);
    if (!widget) return;

    // ElevenLabs convai widget dispatches these custom events
    widget.addEventListener('elevenlabs-convai:call-started', () => {
      setActive(agent.id);
    });
    widget.addEventListener('elevenlabs-convai:call-ended', () => {
      if (activeId === agent.id) endSession();
    });

    // Fallback: also watch for the widget's internal shadow DOM click
    // In case call-started event name differs across widget versions
    widget.addEventListener('call-started', () => setActive(agent.id));
    widget.addEventListener('call-ended', () => {
      if (activeId === agent.id) endSession();
    });
  }

  function setActive(id) {
    activeId = id;
    const agent = agents.find(a => a.id === id);

    // Update status bar
    document.getElementById('active-name').textContent = agent.name;
    document.getElementById('status-bar').classList.add('visible');

    // Update cards
    agents.forEach(a => {
      const col = document.getElementById('col-' + a.id);
      const lock = document.getElementById('lock-' + a.id);
      const lockName = document.getElementById('lock-name-' + a.id);

      if (a.id === id) {
        col.classList.add('active');
        lock.classList.remove('visible');
      } else {
        col.classList.remove('active');
        lock.classList.add('visible');
        lockName.textContent = agent.name;
      }
    });
  }

  function endSession() {
    activeId = null;
    document.getElementById('status-bar').classList.remove('visible');
    agents.forEach(a => {
      document.getElementById('col-' + a.id).classList.remove('active');
      document.getElementById('lock-' + a.id).classList.remove('visible');
    });
  }

  buildGrid();
</script>
</body>
</html>
