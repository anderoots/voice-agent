<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agents — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080810;
      --surface: #0f0f1a;
      --border: #1e1e30;
      --border-active: #7c5cfc;
      --accent: #7c5cfc;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #52526e;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 3.5rem 1rem 2.5rem;
    }
    header h1 {
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1;
      margin-bottom: .6rem;
      background: linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--muted);
      font-size: .95rem;
    }

    /* ── Status banner ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      max-width: 720px;
      margin: 0 auto 1.5rem;
      background: rgba(124,92,252,.1);
      border: 1px solid rgba(124,92,252,.25);
      border-radius: 10px;
      padding: .6rem 1.2rem;
      font-size: .88rem;
      color: var(--accent2);
    }
    #status-bar.visible { display: flex; }
    .dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    #end-btn {
      margin-left: auto;
      background: none;
      border: 1px solid rgba(239,68,68,.5);
      color: var(--danger);
      border-radius: 6px;
      padding: .2rem .7rem;
      cursor: pointer;
      font-size: .8rem;
      transition: background .2s;
    }
    #end-btn:hover { background: rgba(239,68,68,.12); }

    /* ── Grid ── */
    main {
      flex: 1;
      padding: 0 1.5rem 4rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* ── Agent column ── */
    .agent-col {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    .agent-label {
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding-left: .25rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      transition: color .3s;
    }
    .agent-col.active .agent-label { color: var(--accent2); }
    .live-dot {
      display: none;
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }
    .agent-col.active .live-dot { display: block; }

    /* ── Widget card ── */
    .widget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      transition: border-color .35s, box-shadow .35s;
      aspect-ratio: 9 / 14;
    }
    .agent-col.active .widget-card {
      border-color: var(--border-active);
      box-shadow: 0 0 0 1px var(--border-active), 0 12px 40px rgba(124,92,252,.2);
    }

    .widget-card iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Lock overlay ── */
    .lock-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(8,8,16,.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .75rem;
      border-radius: 16px;
      cursor: not-allowed;
    }
    .lock-overlay.visible { display: flex; }
    .lock-icon { font-size: 1.8rem; opacity: .45; }
    .lock-overlay p {
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
      padding: 0 1.5rem;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: rgba(255,255,255,.08);
      font-size: .75rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <h1>Voice Agents</h1>
  <p>Selecciona un agente para iniciar una conversación de voz</p>
</header>

<main>
  <div id="status-bar">
    <span class="dot"></span>
    <span>Sesión activa con <strong id="active-name"></strong></span>
    <button id="end-btn" onclick="endSession()">Terminar sesión</button>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>Voice Agents Demo &mdash; Powered by ElevenLabs</footer>

<script>
  const agents = [
    { id: 'cindy',   name: 'Cindy',   agentId: 'agent_8001kqcwjt80ek9be1q8865tpmg5' },
    { id: 'vanessa', name: 'Vanessa', agentId: 'agent_5601kqd9rrmgfe2bp53yb07x04kd' },
    { id: 'tripti',  name: 'Tripti',  agentId: 'agent_2101kqd9yxgef1xv216215nbc466' },
  ];

  let activeId = null;

  // Build grid with iframes pointing to agent.html?agent_id=...
  const grid = document.getElementById('grid');
  grid.innerHTML = agents.map(a => `
    <div class="agent-col" id="col-${a.id}">
      <div class="agent-label">
        ${a.name}
        <span class="live-dot"></span>
      </div>
      <div class="widget-card">
        <iframe
          id="frame-${a.id}"
          src="agent.html?agent_id=${a.agentId}"
          allow="microphone; autoplay"
          allowfullscreen
        ></iframe>
        <div class="lock-overlay" id="lock-${a.id}">
          <div class="lock-icon">🔒</div>
          <p>Sesión en curso con <strong id="lock-name-${a.id}"></strong></p>
        </div>
      </div>
    </div>
  `).join('');

  // Listen for postMessage events from iframes
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'call-started') {
      // Find which iframe sent the message
      const frame = agents.find(a => {
        const f = document.getElementById('frame-' + a.id);
        return f && f.contentWindow === e.source;
      });
      if (frame) setActive(frame.id);
    }
    if (e.data?.type === 'call-ended') {
      const frame = agents.find(a => {
        const f = document.getElementById('frame-' + a.id);
        return f && f.contentWindow === e.source;
      });
      if (frame && activeId === frame.id) endSession();
    }
  });

  function setActive(id) {
    activeId = id;
    const agent = agents.find(a => a.id === id);
    document.getElementById('active-name').textContent = agent.name;
    document.getElementById('status-bar').classList.add('visible');

    agents.forEach(a => {
      const col  = document.getElementById('col-' + a.id);
      const lock = document.getElementById('lock-' + a.id);
      const lockName = document.getElementById('lock-name-' + a.id);
      if (a.id === id) {
        col.classList.add('active');
        lock.classList.remove('visible');
      } else {
        col.classList.remove('active');
        lock.classList.add('visible');
        lockName.textContent = agent.name;
      }
    });
  }

  function endSession() {
    activeId = null;
    document.getElementById('status-bar').classList.remove('visible');
    agents.forEach(a => {
      document.getElementById('col-' + a.id).classList.remove('active');
      document.getElementById('lock-' + a.id).classList.remove('visible');
    });
  }
</script>
</body>
</html>
