<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agents — Arreglatech</title>
  <script src="https://elevenlabs.io/convai-widget/index.js" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: #e4e4e9;
      --border-active: #6b4efa;
      --accent: #6b4efa;
      --text: #1a1a2e;
      --muted: #8e8ea8;
      --success: #16a34a;
      --danger: #dc2626;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 4rem 1rem 2.5rem;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }
    .logo-mark span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    header h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: 1.1;
      margin-bottom: .6rem;
    }
    header h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #9ca3af 0%, #d1d5db 60%, #6b7280 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: var(--muted); font-size: .95rem; }

    /* Status bar */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      max-width: 680px;
      margin: 1.2rem auto 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .65rem 1.2rem;
      font-size: .85rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }
    #status-bar.visible { display: flex; }
    .dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #end-btn {
      margin-left: auto;
      background: none;
      border: 1px solid #fca5a5;
      color: var(--danger);
      border-radius: 7px;
      padding: .22rem .75rem;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 500;
      font-family: inherit;
      transition: background .2s;
    }
    #end-btn:hover { background: #fef2f2; }

    main { flex: 1; padding: 2rem 1.5rem 5rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 1080px;
      margin: 0 auto;
    }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

    .agent-col { display: flex; flex-direction: column; gap: .8rem; }

    .agent-label-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: 0 .1rem;
    }
    .agent-label {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .45rem;
      flex: 1;
      transition: color .3s;
    }
    .agent-col.active .agent-label { color: var(--accent); }
    .live-dot {
      display: none;
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }
    .agent-col.active .live-dot { display: block; }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 7px;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: .9rem;
      transition: border-color .2s, color .2s, background .2s;
      flex-shrink: 0;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); background: #f0ebff; }
    .refresh-btn.spinning { animation: spin .5s linear; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Widget card ──
       transform: translateZ(0) creates a new containing block so the
       widget's internal position:fixed renders inside the card, not the
       viewport. This lets the user click the real ElevenLabs button
       directly, preserving the user-gesture chain for mic access.       */
    .widget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 9 / 14;
      transition: border-color .35s, box-shadow .35s;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      /* Trap position:fixed children inside this card */
      transform: translateZ(0);
    }
    .agent-col.active .widget-card {
      border-color: var(--border-active);
      box-shadow: 0 0 0 1px var(--border-active),
                  0 8px 32px rgba(107,78,250,.15),
                  0 1px 3px rgba(0,0,0,.06);
    }

    /* The ElevenLabs widget fills the card so its button is clickable
       anywhere inside the card area. */
    elevenlabs-convai {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 3;
    }

    /* Avatar orb */
    .card-avatar {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ede9fe, #ddd6fe);
      border: 2px solid #e0d9ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem;
      position: relative;
      z-index: 1;
    }
    .agent-col.active .card-avatar {
      border-color: var(--accent);
      box-shadow: 0 0 0 6px rgba(107,78,250,.08);
      animation: orb-pulse 2s ease-in-out infinite;
    }
    @keyframes orb-pulse {
      0%,100% { box-shadow: 0 0 0 6px rgba(107,78,250,.08); }
      50%      { box-shadow: 0 0 0 14px rgba(107,78,250,.04); }
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -.01em;
      position: relative;
      z-index: 1;
    }

    .card-hint {
      font-size: .78rem;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }
    .agent-col.active .card-hint { display: none; }

    /* Talking bars */
    .talking-indicator {
      display: none;
      align-items: center;
      gap: 4px;
      height: 20px;
      position: relative;
      z-index: 1;
    }
    .agent-col.active .talking-indicator { display: flex; }
    .talking-indicator span {
      display: block;
      width: 3px;
      border-radius: 99px;
      background: var(--accent);
    }
    .talking-indicator span:nth-child(1){height:6px;  animation:bar 1s .0s ease-in-out infinite alternate}
    .talking-indicator span:nth-child(2){height:14px; animation:bar 1s .1s ease-in-out infinite alternate}
    .talking-indicator span:nth-child(3){height:20px; animation:bar 1s .2s ease-in-out infinite alternate}
    .talking-indicator span:nth-child(4){height:14px; animation:bar 1s .3s ease-in-out infinite alternate}
    .talking-indicator span:nth-child(5){height:8px;  animation:bar 1s .4s ease-in-out infinite alternate}
    @keyframes bar { from{transform:scaleY(.3)} to{transform:scaleY(1)} }

    /* Lock overlay — sits above the widget (z-index > 3) */
    .lock-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(245,245,247,.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .8rem;
      border-radius: 18px;
    }
    .lock-overlay.visible { display: flex; }
    .lock-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: #f0ebff;
      border: 1px solid #ddd6fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .lock-overlay p {
      font-size: .78rem;
      color: var(--muted);
      text-align: center;
      padding: 0 1.5rem;
      line-height: 1.6;
    }
    .lock-overlay strong { color: var(--accent); font-weight: 600; }

    footer {
      text-align: center;
      padding: 1.6rem;
      color: var(--muted);
      font-size: .75rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    footer .footer-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark"><span></span> Arreglatech</div>
  <h1>Voice <em>Agents</em></h1>
  <p>Selecciona un agente para iniciar una conversación de voz</p>
</header>

<main>
  <div id="status-bar">
    <span class="dot"></span>
    <span>Sesión activa con <strong id="active-name"></strong></span>
    <button id="end-btn" onclick="endSession()">Terminar sesión</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Powered by Design Team
  <span class="footer-dot"></span>
  Arreglatech
</footer>

<script>
  const agents = [
    { id: 'cindy',   name: 'Cindy',   emoji: '👩‍💼', agentId: 'agent_8001kqcwjt80ek9be1q8865tpmg5' },
    { id: 'vanessa', name: 'Vanessa', emoji: '👩‍🔬', agentId: 'agent_5601kqd9rrmgfe2bp53yb07x04kd' },
    { id: 'tripti',  name: 'Tripti',  emoji: '👩‍🎨', agentId: 'agent_2101kqd9yxgef1xv216215nbc466' },
  ];

  let activeId = null;

  const grid = document.getElementById('grid');
  grid.innerHTML = agents.map(a => `
    <div class="agent-col" id="col-${a.id}">
      <div class="agent-label-row">
        <div class="agent-label">
          ${a.name}
          <span class="live-dot"></span>
        </div>
        <button class="refresh-btn" title="Reiniciar agente" onclick="reloadAgent('${a.id}')">↺</button>
      </div>
      <div class="widget-card" id="card-${a.id}">
        <!-- ElevenLabs widget fills the card — user clicks its button directly -->
        <elevenlabs-convai id="widget-${a.id}" agent-id="${a.agentId}"></elevenlabs-convai>
        <!-- Decorative layer behind the widget -->
        <div class="card-avatar">${a.emoji}</div>
        <div class="card-name">${a.name}</div>
        <div class="talking-indicator">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="card-hint">Toca para llamar</div>
        <!-- Lock overlay — blocks inactive agents -->
        <div class="lock-overlay" id="lock-${a.id}">
          <div class="lock-icon">🔒</div>
          <p>Sesión en curso con<br><strong id="lock-name-${a.id}"></strong></p>
        </div>
      </div>
    </div>
  `).join('');

  // Wire up widget events
  agents.forEach(a => {
    const w = document.getElementById('widget-' + a.id);
    ['elevenlabs-convai:call-started', 'call-started'].forEach(ev =>
      w.addEventListener(ev, () => onCallStarted(a.id))
    );
    ['elevenlabs-convai:call-ended', 'call-ended'].forEach(ev =>
      w.addEventListener(ev, () => { if (activeId === a.id) endSession(); })
    );
  });

  function onCallStarted(id) {
    activeId = id;
    const agent = agents.find(a => a.id === id);
    document.getElementById('active-name').textContent = agent.name;
    document.getElementById('status-bar').classList.add('visible');
    agents.forEach(a => {
      const col  = document.getElementById('col-' + a.id);
      const lock = document.getElementById('lock-' + a.id);
      if (a.id === id) {
        col.classList.add('active');
        lock.classList.remove('visible');
      } else {
        col.classList.remove('active');
        lock.classList.add('visible');
        document.getElementById('lock-name-' + a.id).textContent = agent.name;
      }
    });
  }

  function endSession() {
    if (activeId) {
      const w = document.getElementById('widget-' + activeId);
      if (w && typeof w.endSession === 'function') w.endSession();
    }
    activeId = null;
    document.getElementById('status-bar').classList.remove('visible');
    agents.forEach(a => {
      document.getElementById('col-' + a.id).classList.remove('active');
      document.getElementById('lock-' + a.id).classList.remove('visible');
    });
  }

  function reloadAgent(id) {
    if (activeId === id) endSession();
    const btn = document.querySelector(`#col-${id} .refresh-btn`);
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 500);

    const agent = agents.find(a => a.id === id);
    const card  = document.getElementById('card-' + id);
    const old   = document.getElementById('widget-' + id);
    if (old) old.remove();

    const w = document.createElement('elevenlabs-convai');
    w.id = 'widget-' + id;
    w.setAttribute('agent-id', agent.agentId);
    card.prepend(w);

    ['elevenlabs-convai:call-started', 'call-started'].forEach(ev =>
      w.addEventListener(ev, () => onCallStarted(id))
    );
    ['elevenlabs-convai:call-ended', 'call-ended'].forEach(ev =>
      w.addEventListener(ev, () => { if (activeId === id) endSession(); })
    );
  }
</script>
</body>
</html>
