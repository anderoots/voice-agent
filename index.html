<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Agents — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3d;
      --accent: #7c5cfc;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #6b6b85;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      margin: 1.2rem auto 0;
    }
    header .badge {
      display: inline-block;
      background: rgba(124,92,252,.15);
      border: 1px solid rgba(124,92,252,.35);
      color: var(--accent2);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .3rem .9rem;
      border-radius: 99px;
      margin-bottom: 1rem;
    }
    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--muted);
      margin-top: .6rem;
      font-size: 1rem;
    }

    /* ── Status bar ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      max-width: 700px;
      margin: .5rem auto 0;
      background: rgba(124,92,252,.12);
      border: 1px solid rgba(124,92,252,.3);
      border-radius: 10px;
      padding: .65rem 1.2rem;
      font-size: .9rem;
      color: var(--accent2);
    }
    #status-bar.visible { display: flex; }
    #status-bar .dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .3; }
    }
    #status-bar button {
      margin-left: auto;
      background: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      padding: .25rem .75rem;
      cursor: pointer;
      font-size: .8rem;
      transition: background .2s;
    }
    #status-bar button:hover { background: rgba(239,68,68,.15); }

    /* ── Grid ── */
    main {
      flex: 1;
      padding: 2rem 1rem 4rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      transition: border-color .3s, transform .3s, opacity .3s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,92,252,.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .card:not(.locked):hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }
    .card.locked {
      opacity: .45;
      pointer-events: none;
      filter: grayscale(.4);
    }
    .card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 32px rgba(124,92,252,.25);
    }

    /* Avatar */
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      position: relative;
    }
    .avatar .ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color .3s;
    }
    .card.active .avatar .ring {
      border-color: var(--accent);
      animation: spin-ring 3s linear infinite;
    }
    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }

    .card h2 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .card .role {
      font-size: .82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* Wave visualization (idle animation) */
    .wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
    }
    .wave span {
      display: block;
      width: 3px;
      border-radius: 99px;
      background: var(--accent2);
      opacity: .4;
    }
    .card.active .wave span { opacity: 1; }
    .wave span:nth-child(1) { height: 6px;  animation: bar 1.1s .0s ease-in-out infinite alternate; }
    .wave span:nth-child(2) { height: 14px; animation: bar 1.1s .1s ease-in-out infinite alternate; }
    .wave span:nth-child(3) { height: 20px; animation: bar 1.1s .2s ease-in-out infinite alternate; }
    .wave span:nth-child(4) { height: 14px; animation: bar 1.1s .3s ease-in-out infinite alternate; }
    .wave span:nth-child(5) { height: 8px;  animation: bar 1.1s .4s ease-in-out infinite alternate; }
    .wave span:nth-child(6) { height: 18px; animation: bar 1.1s .5s ease-in-out infinite alternate; }
    .wave span:nth-child(7) { height: 10px; animation: bar 1.1s .6s ease-in-out infinite alternate; }
    @keyframes bar {
      from { transform: scaleY(.4); }
      to   { transform: scaleY(1); }
    }

    /* CTA button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.6rem;
      border-radius: 99px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: filter .2s, transform .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.12); }
    .btn-active {
      background: rgba(34,197,94,.15);
      border: 1px solid var(--success);
      color: var(--success);
      cursor: default;
    }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
    }
    #modal-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    #modal-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    #modal-title { font-weight: 600; font-size: 1.1rem; }
    #modal-subtitle { font-size: .8rem; color: var(--muted); }
    #modal-close {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .2s, color .2s;
    }
    #modal-close:hover { border-color: var(--danger); color: var(--danger); }
    #modal iframe {
      border: none;
      flex: 1;
      width: 100%;
      min-height: 520px;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: .78rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="badge">Demo interactiva</div>
  <h1>Voice Agents</h1>
  <p>Selecciona un agente para iniciar una conversación de voz</p>

  <div id="status-bar">
    <span class="dot"></span>
    <span id="status-text">Sesión activa con <strong></strong></span>
    <button onclick="endSession()">Terminar sesión</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-avatar"></div>
      <div>
        <div id="modal-title"></div>
        <div id="modal-subtitle">Sesión de voz activa</div>
      </div>
      <button id="modal-close" onclick="closeModal()" title="Cerrar">✕</button>
    </div>
    <iframe id="modal-iframe" allow="microphone; camera; autoplay" allowfullscreen></iframe>
  </div>
</div>

<footer>Voice Agents Demo &mdash; Powered by ElevenLabs</footer>

<script>
  const agents = [
    {
      id: 'cindy',
      name: 'Cindy',
      emoji: '👩‍💼',
      role: 'Asistente de ventas y atención al cliente.',
      url: 'https://elevenlabs.io/app/talk-to?agent_id=agent_8001kqcwjt80ek9be1q8865tpmg5&branch_id=agtbrch_7501kqcwjvd6f5yatyw1ea79dx58',
    },
    {
      id: 'vanessa',
      name: 'Vanessa',
      emoji: '👩‍🔬',
      role: 'Especialista en soporte técnico y consultas.',
      url: 'https://elevenlabs.io/app/talk-to?agent_id=agent_5601kqd9rrmgfe2bp53yb07x04kd&branch_id=agtbrch_1801kqd9rsfwfbx92b9x4azv67tk',
    },
    {
      id: 'tripti',
      name: 'Tripti',
      emoji: '👩‍🎨',
      role: 'Agente de experiencia y feedback de usuario.',
      url: 'https://elevenlabs.io/app/talk-to?agent_id=agent_2101kqd9yxgef1xv216215nbc466&branch_id=agtbrch_3701kqd9yyh1fqj9p1yc33ndqe75',
    },
  ];

  let activeId = null;

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = agents.map(a => `
      <div class="card ${activeId === a.id ? 'active' : activeId !== null ? 'locked' : ''}" id="card-${a.id}">
        <div class="avatar">
          ${a.emoji}
          <div class="ring"></div>
        </div>
        <h2>${a.name}</h2>
        <p class="role">${a.role}</p>
        <div class="wave">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        ${activeId === a.id
          ? `<button class="btn btn-active">● En sesión</button>`
          : `<button class="btn btn-primary" onclick="startSession('${a.id}')">▶ Hablar con ${a.name}</button>`
        }
      </div>
    `).join('');
  }

  function startSession(id) {
    const agent = agents.find(a => a.id === id);
    activeId = id;

    // Status bar
    const bar = document.getElementById('status-bar');
    bar.classList.add('visible');
    bar.querySelector('strong').textContent = agent.name;

    // Modal
    document.getElementById('modal-avatar').textContent = agent.emoji;
    document.getElementById('modal-title').textContent = agent.name;
    document.getElementById('modal-iframe').src = agent.url;
    document.getElementById('modal-overlay').classList.add('open');

    renderGrid();
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-iframe').src = '';
    // Keep session active (agent still locked) — user can end from status bar
  }

  function endSession() {
    activeId = null;
    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('modal-iframe').src = '';
    document.getElementById('status-bar').classList.remove('visible');
    renderGrid();
  }

  // Close modal clicking outside
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  renderGrid();
</script>
</body>
</html>
