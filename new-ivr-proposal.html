<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New IVR Proposal — Arreglatech</title>
  <script src="https://elevenlabs.io/convai-widget/index.js" async></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: #e4e4e9;
      --border-active: #6b4efa;
      --accent: #6b4efa;
      --text: #1a1a2e;
      --muted: #8e8ea8;
      --success: #16a34a;
      --danger: #dc2626;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 2.5rem 1rem 2rem;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }
    .logo-mark span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    header h1 {
      font-size: clamp(1.75rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: .5rem;
    }
    header h1 em {
      font-style: normal;
      font-weight: 400;
      color: var(--muted);
    }
    header p {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 400;
    }

    /* ── Status bar ── */
    #status-bar {
      display: none;
      align-items: center;
      gap: .6rem;
      max-width: 640px;
      margin: 1rem auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .6rem 1.1rem;
      font-size: .84rem;
      color: var(--text);
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }
    #status-bar.visible { display: flex; }
    .dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #end-btn {
      margin-left: auto;
      background: none;
      border: 1px solid #fca5a5;
      color: var(--danger);
      border-radius: 7px;
      padding: .22rem .75rem;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 500;
      font-family: inherit;
      transition: background .2s ease;
    }
    #end-btn:hover { background: #fef2f2; }
    #end-btn:focus-visible {
      outline: 2px solid var(--danger);
      outline-offset: 2px;
    }

    /* ── Main ── */
    main { flex: 1; padding: 1.5rem 1.5rem 4rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      max-width: 1040px;
      margin: 0 auto;
    }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

    /* ── Agent column ── */
    .agent-col { display: flex; flex-direction: column; gap: .7rem; }

    .agent-label-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: 0 .1rem;
    }
    .agent-label {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .4rem;
      flex: 1;
      transition: color .25s ease;
    }
    .agent-col.active .agent-label { color: var(--accent); }
    .live-dot {
      display: none;
      width: 6px; height: 6px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .agent-col.active .live-dot { display: block; }

    /* Refresh button */
    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 7px;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease;
      flex-shrink: 0;
      padding: 0;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); background: #f0ebff; }
    .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .refresh-btn.spinning svg { animation: spin .5s cubic-bezier(0.4,0,0.2,1); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Widget card ── */
    .widget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      min-height: 380px;
      transition: border-color .3s ease, box-shadow .3s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 2rem;
      padding-bottom: 200px;
      gap: .7rem;
      cursor: pointer;
      transform: translateZ(0);
    }
    .widget-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .agent-col.active .widget-card {
      border-color: var(--border-active);
      box-shadow: 0 8px 28px rgba(107,78,250,.14), 0 1px 3px rgba(0,0,0,.05);
      cursor: default;
    }

    elevenlabs-convai {
      position: absolute !important;
      bottom: 36px !important;
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) !important;
      z-index: 5;
    }

    .widget-loading {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ede9fe, #ddd6fe);
      opacity: .5;
      animation: shimmer 1.4s ease-in-out infinite;
      z-index: 4;
      display: none;
    }
    .widget-loading.visible { display: block; }
    @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:.8} }

    /* Avatar */
    .card-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--avatar-bg, #f0ecff);
      border: 1.5px solid var(--avatar-border, #ddd6fe);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      z-index: 1;
      transition: border-color .25s ease, box-shadow .25s ease;
      pointer-events: none;
      color: var(--avatar-color, #a78bfa);
      overflow: hidden;
    }
    .card-avatar svg {
      width: 44px; height: 44px;
    }
    .agent-col.active .card-avatar {
      border-color: var(--accent);
      box-shadow: 0 0 0 6px rgba(107,78,250,.08);
      animation: orb-pulse 2s ease-in-out infinite;
    }
    @keyframes orb-pulse {
      0%,100% { box-shadow: 0 0 0 6px rgba(107,78,250,.08); }
      50%      { box-shadow: 0 0 0 12px rgba(107,78,250,.04); }
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -.01em;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .in-call-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: .72rem;
      font-weight: 500;
      color: var(--success);
      padding: .18rem .55rem;
      background: rgba(22, 163, 74, .08);
      border-radius: 99px;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }
    .agent-col.active .in-call-badge { display: flex; }
    .in-call-dot {
      width: 5px; height: 5px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* ── Lock overlay ── */
    .lock-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(245,245,247,.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .8rem;
      border-radius: 18px;
      pointer-events: all;
    }
    .lock-overlay.visible { display: flex; }
    .lock-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: #f0ebff;
      border: 1px solid #ddd6fe;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .lock-overlay p {
      font-size: .76rem;
      color: var(--muted);
      text-align: center;
      padding: 0 1.5rem;
      line-height: 1.6;
      font-weight: 400;
    }
    .lock-overlay strong { color: var(--accent); font-weight: 600; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.4rem;
      color: var(--muted);
      font-size: .72rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    footer .footer-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--border);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-mark"><span></span> Arreglatech</div>
  <h1>New IVR <em>Proposal</em></h1>
  <p>Selecciona un agente para iniciar una conversación</p>
</header>

<main>
  <div id="status-bar">
    <span class="dot"></span>
    <span>Sesión activa con <strong id="active-name"></strong></span>
    <button id="end-btn" onclick="endSession()">Terminar sesión</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Powered by Design Team
  <span class="footer-dot"></span>
  Arreglatech
</footer>

<script>
  const AVATAR_SVG = `<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="22" cy="16" r="7.5" fill="currentColor" opacity=".9"/>
    <path d="M6 40c0-8.837 7.163-16 16-16s16 7.163 16 16" fill="currentColor" opacity=".7"/>
  </svg>`;

  const agents = [
    { id: 'tripti',  name: 'Tripti',  agentId: 'agent_8601kqz6w3k1f4zvkbbcr8p1nx6b',
      avatarBg: '#fdf2f8', avatarBorder: '#fbcfe8', avatarColor: '#d4609a' }, // rosa
    { id: 'marcela', name: 'Marcela', agentId: 'agent_9701kqzgeza4fahb1m342b0877jd',
      avatarBg: '#f0fdf4', avatarBorder: '#bbf7d0', avatarColor: '#16a34a' }, // verde
    { id: 'cindy',   name: 'Cindy',   agentId: 'agent_1301kqzgjj39fa19h1h3gg7yytyq',
      avatarBg: '#f0ecff', avatarBorder: '#ddd6fe', avatarColor: '#9d7ff0' }, // violeta
  ];

  const REFRESH_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`;

  let activeId = null;

  const grid = document.getElementById('grid');
  grid.innerHTML = agents.map(a => `
    <div class="agent-col" id="col-${a.id}">
      <div class="agent-label-row">
        <div class="agent-label">
          ${a.name}
          <span class="live-dot"></span>
        </div>
        <button class="refresh-btn" title="Reconectar agente" aria-label="Reconectar ${a.name}" onclick="reloadAgent('${a.id}')">${REFRESH_ICON}</button>
      </div>
      <div class="widget-card" id="card-${a.id}" role="button" tabindex="0" aria-label="Llamar a ${a.name}">
        <elevenlabs-convai id="widget-${a.id}" agent-id="${a.agentId}"></elevenlabs-convai>
        <div class="widget-loading" id="loading-${a.id}"></div>
        <div class="card-avatar" style="--avatar-bg:${a.avatarBg};--avatar-border:${a.avatarBorder};--avatar-color:${a.avatarColor}">${AVATAR_SVG}</div>
        <div class="card-name">${a.name}</div>
        <div class="in-call-badge">
          <span class="in-call-dot"></span>
          En llamada
        </div>
        <div class="lock-overlay" id="lock-${a.id}">
          <div class="lock-icon" aria-hidden="true">🔒</div>
          <p>Sesión en curso con<br><strong id="lock-name-${a.id}"></strong></p>
        </div>
      </div>
    </div>
  `).join('');

  customElements.whenDefined('elevenlabs-convai').then(() => {
    agents.forEach(a => document.getElementById('loading-' + a.id)?.classList.remove('visible'));
  });
  setTimeout(() => {
    if (!customElements.get('elevenlabs-convai')) {
      agents.forEach(a => document.getElementById('loading-' + a.id)?.classList.add('visible'));
    }
  }, 300);

  agents.forEach(a => {
    const w    = document.getElementById('widget-' + a.id);
    const card = document.getElementById('card-' + a.id);

    ['elevenlabs-convai:call-started', 'call-started'].forEach(ev =>
      w.addEventListener(ev, () => setActive(a.id))
    );
    ['elevenlabs-convai:call-ended', 'call-ended'].forEach(ev =>
      w.addEventListener(ev, () => { if (activeId === a.id) endSession(); })
    );

    card.addEventListener('click', (e) => {
      if (activeId !== null) return;
      if (e.target.closest('elevenlabs-convai')) return;
      const widget = document.getElementById('widget-' + a.id);
      if (widget && typeof widget.startSession === 'function') widget.startSession();
    });

    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (activeId !== null) return;
        const widget = document.getElementById('widget-' + a.id);
        if (widget && typeof widget.startSession === 'function') widget.startSession();
      }
    });
  });

  function setActive(id) {
    activeId = id;
    const agent = agents.find(a => a.id === id);
    document.getElementById('active-name').textContent = agent.name;
    document.getElementById('status-bar').classList.add('visible');
    document.getElementById('card-' + id).removeAttribute('tabindex');
    agents.forEach(a => {
      const col      = document.getElementById('col-' + a.id);
      const lock     = document.getElementById('lock-' + a.id);
      const lockName = document.getElementById('lock-name-' + a.id);
      if (a.id === id) {
        col.classList.add('active');
        lock.classList.remove('visible');
      } else {
        col.classList.remove('active');
        lock.classList.add('visible');
        lockName.textContent = agent.name;
      }
    });
  }

  function endSession() {
    if (activeId) {
      const w = document.getElementById('widget-' + activeId);
      if (w && typeof w.endSession === 'function') w.endSession();
      document.getElementById('card-' + activeId)?.setAttribute('tabindex', '0');
    }
    activeId = null;
    document.getElementById('status-bar').classList.remove('visible');
    agents.forEach(a => {
      document.getElementById('col-' + a.id).classList.remove('active');
      document.getElementById('lock-' + a.id).classList.remove('visible');
    });
  }

  function reloadAgent(id) {
    if (activeId === id) endSession();
    const btn   = document.querySelector(`#col-${id} .refresh-btn`);
    const agent = agents.find(a => a.id === id);
    const card  = document.getElementById('card-' + id);

    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 500);

    const old = document.getElementById('widget-' + id);
    if (old) old.remove();

    const w = document.createElement('elevenlabs-convai');
    w.id = 'widget-' + id;
    w.setAttribute('agent-id', agent.agentId);
    card.prepend(w);

    ['elevenlabs-convai:call-started', 'call-started'].forEach(ev =>
      w.addEventListener(ev, () => setActive(id))
    );
    ['elevenlabs-convai:call-ended', 'call-ended'].forEach(ev =>
      w.addEventListener(ev, () => { if (activeId === id) endSession(); })
    );
  }
</script>
</body>
</html>
